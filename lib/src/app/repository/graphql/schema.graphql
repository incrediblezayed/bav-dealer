"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

type User {
  id: ID!
  createdAt: DateTime
  modifiedAt: DateTime
  name: String
  phoneNumber: String
  email: String
  address: String
  password: PasswordState
  emailVerified: Boolean
  phoneNumberVerified: Boolean
  isAdmin: Boolean
  profile_image: ImageFieldOutput
  aadhaar: FileFieldOutput
  driving_license: FileFieldOutput
  addresses(where: AddressWhereInput! = {}, orderBy: [AddressOrderByInput!]! = [], take: Int, skip: Int! = 0): [Address!]
  addressesCount(where: AddressWhereInput! = {}): Int
  favorites(where: FavoriteWhereInput! = {}, orderBy: [FavoriteOrderByInput!]! = [], take: Int, skip: Int! = 0): [Favorite!]
  favoritesCount(where: FavoriteWhereInput! = {}): Int
  cartItems(where: CartItemWhereInput! = {}, orderBy: [CartItemOrderByInput!]! = [], take: Int, skip: Int! = 0): [CartItem!]
  cartItemsCount(where: CartItemWhereInput! = {}): Int
  wallet: Wallet
  referralCode: ReferralCode
  deactivate: Boolean
  passwordResetToken: PasswordState
  passwordResetIssuedAt: DateTime
  passwordResetRedeemedAt: DateTime
}

scalar DateTime

type PasswordState {
  isSet: Boolean!
}

type ImageFieldOutput {
  id: ID!
  filesize: Int!
  width: Int!
  height: Int!
  extension: ImageExtension!
  url: String!
}

enum ImageExtension {
  jpg
  png
  webp
  gif
}

type FileFieldOutput {
  filename: String!
  filesize: Int!
  url: String!
}

input UserWhereUniqueInput {
  id: ID
  phoneNumber: String
  email: String
}

input UserWhereInput {
  AND: [UserWhereInput!]
  OR: [UserWhereInput!]
  NOT: [UserWhereInput!]
  id: IDFilter
  createdAt: DateTimeNullableFilter
  modifiedAt: DateTimeNullableFilter
  name: StringFilter
  phoneNumber: StringFilter
  email: StringFilter
  address: StringFilter
  emailVerified: BooleanFilter
  phoneNumberVerified: BooleanFilter
  isAdmin: BooleanFilter
  addresses: AddressManyRelationFilter
  favorites: FavoriteManyRelationFilter
  cartItems: CartItemManyRelationFilter
  wallet: WalletWhereInput
  referralCode: ReferralCodeWhereInput
  deactivate: BooleanFilter
  passwordResetToken: PasswordFilter
  passwordResetIssuedAt: DateTimeNullableFilter
  passwordResetRedeemedAt: DateTimeNullableFilter
}

input IDFilter {
  equals: ID
  in: [ID!]
  notIn: [ID!]
  lt: ID
  lte: ID
  gt: ID
  gte: ID
  not: IDFilter
}

input DateTimeNullableFilter {
  equals: DateTime
  in: [DateTime!]
  notIn: [DateTime!]
  lt: DateTime
  lte: DateTime
  gt: DateTime
  gte: DateTime
  not: DateTimeNullableFilter
}

input StringFilter {
  equals: String
  in: [String!]
  notIn: [String!]
  lt: String
  lte: String
  gt: String
  gte: String
  contains: String
  startsWith: String
  endsWith: String
  mode: QueryMode
  not: NestedStringFilter
}

enum QueryMode {
  default
  insensitive
}

input NestedStringFilter {
  equals: String
  in: [String!]
  notIn: [String!]
  lt: String
  lte: String
  gt: String
  gte: String
  contains: String
  startsWith: String
  endsWith: String
  not: NestedStringFilter
}

input BooleanFilter {
  equals: Boolean
  not: BooleanFilter
}

input AddressManyRelationFilter {
  every: AddressWhereInput
  some: AddressWhereInput
  none: AddressWhereInput
}

input FavoriteManyRelationFilter {
  every: FavoriteWhereInput
  some: FavoriteWhereInput
  none: FavoriteWhereInput
}

input CartItemManyRelationFilter {
  every: CartItemWhereInput
  some: CartItemWhereInput
  none: CartItemWhereInput
}

input PasswordFilter {
  isSet: Boolean!
}

