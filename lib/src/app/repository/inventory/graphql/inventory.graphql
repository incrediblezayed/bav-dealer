query VehicleVariants(
  $where: VehicleVariantWhereInput!
  $orderBy: [VehicleVariantOrderByInput!]!
  $skip: Int!
  $take: Int
) {
  vehicleVariantsCount(where: $where)
  vehicleVariants(where: $where, orderBy: $orderBy, skip: $skip, take: $take) {
    prices {
      amount
      category {
        name
        description
      }
    }
    colors {
      id
      code
      images {
        name
        image {
          url
          width
          id
        }
      }
      name
    }
    name
    default
    id
    totalPrice
    vehicle {
      brand {
        id
        name
      }
      name
      id
      type {
        name
      }
    }
  }
}

