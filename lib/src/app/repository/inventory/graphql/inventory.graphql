query ProductVariants(
  $skip: Int!
  $take: Int
  $where: ProductVariantWhereInput!
  $location: [Float!]
  $orderBy: [ProductVariantOrderByInput!]!
) {
  productVariants(skip: $skip, take: $take, where: $where, orderBy: $orderBy) {
    id
    name
    availableProductDealer(location: $location)
    prices {
      amount
      category {
        name
        description
      }
    }
    specifications {
      id
      isKeyFeature
      name
      specification {
        image {
          url
        }
        id
        name
        description
        unit
      }
      type
      intValue
      stringValue
      category {
        id
        name
        description
      }
    }
    totalPrice
    images {
      image {
        url
        width
        id
      }
    }
    gallery {
      file
      type
      index
    }
    product {
      brand {
        id
        name
        logo {
          id
          extension
          url
        }
      }
      name
      description
      longDescription
      id
      type {
        id
        name
        description
      }
      specifications {
        id
        isKeyFeature
        name
        specification {
          image {
            url
          }
          id
          name
          description
          unit
        }
        type
        intValue
        stringValue
        category {
          id
          name
          description
        }
      }
    }
    tags {
      id
      title
      description
    }
    images {
      id
      name
      image {
        url
      }
    }
  }
}

