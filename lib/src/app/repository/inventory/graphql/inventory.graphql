query VehicleVariants(
  $where: VehicleVariantWhereInput!
  $orderBy: [VehicleVariantOrderByInput!]!
) {
  vehicleVariants(where: $where, orderBy: $orderBy) {
    prices {
      amount
      category {
        name
        description
      }
    }
    colors {
      id
      code
      images {
        name
        image {
          url
          width
          id
        }
      }
      name
    }
    name
    default
    id
    totalPrice
    vehicle {
      brand {
        id
        name
      }
      name
      id
      type {
        name
      }
    }
  }
}

mutation CreateVehicleDealerStockRequest(
  $data: VehicleDealerStockRequestCreateInput!
) {
  createVehicleDealerStockRequest(data: $data) {
    type
    stock
    totalPrice
  }
}

query VehicleDealers($where: VehicleDealerWhereInput!) {
  vehicleDealers(where: $where) {
    vehicleColor {
      id
      name
      code
      images {
        id
        image {
          url
        }
      }
    }
    vehicleVariant {
      id
      name
      modifiedAt
      vehicle {
        brand {
          id
          name
        }
        name
        id
        description
      }
    }

    id
    stock
    prices {
      id
      amount
      category {
        id
        name
      }
    }
    totalPrice
  }
}

mutation CreateVehicleDealer($data: VehicleDealerCreateInput!) {
  createVehicleDealer(data: $data) {
    id
  }
}

query PriceCategories {
  priceCategories {
    id
    name
    description
    createdAt
    modifiedAt
  }
}
