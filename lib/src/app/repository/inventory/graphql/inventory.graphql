  vehicleDealers(where: $where, take: $take, skip: $skip) {
    vehicleColor {
      id
      name
      code
      images {
        id
        image {
          url
        }
      }
    }
    vehicleVariant {
      id
      name
      modifiedAt
      vehicle {
        brand {
          id
          name
        }
        name
        id
        description
      }
    }

    id
    stock
    prices {
      id
      amount
      category {
        id
        name
      }
    }
    totalPrice
    guarantees {
      name
      id
      description
    }
  }
}

