query AppNotifications {
  appNotifications {
    id
    body
    createdAt
    modifiedAt
    notificationType {
      id
      createdAt
      name
    }
    title
  }

  
}

mutation UserDeviceRegistration($data: FirebaseDeviceTokenCreateInput!) {
  createFirebaseDeviceToken(data: $data) {
    deviceToken   
  }
}