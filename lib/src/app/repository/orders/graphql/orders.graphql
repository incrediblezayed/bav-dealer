}

mutation UpdateVehicleOrder(
  $where: VehicleOrderWhereUniqueInput!
  $data: VehicleOrderUpdateInput!
) {
  updateVehicleOrder(where: $where, data: $data) {
    id
  }
}

mutation CreateOrderRejectionByDealer($data: OrderRejectionByDealerCreateInput!) {
  createOrderRejectionByDealer(data: $data) {
    id
  }
}