query ProductOrders($where: ProductOrderWhereInput!, $orderBy: [ProductOrderOrderByInput!]!, $skip: Int!, $take: Int!) {
  productOrdersCount(where: $where)
  productOrders(where: $where, orderBy: $orderBy, skip: $skip, take: $take) {
    id
    price
    dealer {
      productVariant {
        product {
          name
        }
        name
        images {
          image {
            url
          }
        }
      }
      dealer {
        id
      }
      id
      prices {
        amount
        category {
          name
          id
        }
      }
    }
    status
    order {
      user {
        id
        email
        name
        phoneNumber
        addresses {
          id
          phoneNumber
          pinCode
          state
          town
          address
          district
          name
        }
      }
      id
      createdAt
    }
    createdAt
  }
}

