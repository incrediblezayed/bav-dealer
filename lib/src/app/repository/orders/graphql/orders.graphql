mutation UpdateProductOrder(
  $where: ProductOrderWhereUniqueInput!,
  $data: ProductOrderUpdateInput!) {
  updateProductOrder(where: $where, data: $data) {
    id
  }
}

mutation UpdateVehicleOrder(
  $where: VehicleOrderWhereUniqueInput!
