name: dealerapp
description: A new Flutter project.
publish_to: "none" 
version: 1.0.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  dio: ^5.8.0+1
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  ferry: ^0.16.1+2
  flutter_screenutil: ^5.9.3
  ferry_hive_store: ^0.6.0+1
  after_layout: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_riverpod: ^2.6.1
  gql_dio_link: ^1.0.1+1
  flutter_spinkit: ^5.2.1
  iconsax: ^0.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  gql_http_link: ^1.1.0
  built_collection: ^5.1.1
  auto_size_text: ^3.0.0
  url_launcher: ^6.3.1
  another_flushbar: ^1.12.30
  webview_flutter: ^4.13.0
  sentry_flutter: ^8.14.2
  app_tracking_transparency: ^2.0.6+1
  multi_dropdown: ^3.0.1
  geolocator: ^14.0.1
  firebase_core: ^3.14.0
  firebase_analytics: ^11.5.0
  # stack_trace: ^1.12.1
  built_value: ^8.10.1
  http: ^1.4.0
  collection: ^1.19.1
  sms_autofill: ^2.4.1
  gap: ^3.0.1
  flutter_local_notifications: ^19.2.1
  firebase_messaging: ^15.2.7
  google_maps_flutter: ^2.12.2
  google_geocoding_api: ^1.5.2
  
dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  ferry_generator: ^0.12.0+2
  analyzer: ^7.4.5


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/gifs/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
