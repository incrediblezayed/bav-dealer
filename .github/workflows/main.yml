on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
name: "Build"
jobs:
  build:
    name: Build Dealer Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          flutter-version: "3.13.8"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.0"
      - run: flutter update-packages --force-upgrade
      - run: flutter pub get
      - run: mkdir releaseBuilds
      - run: flutter build apk --dart-define-from-file devEnv.json
      - run: flutter build appbundle --dart-define-from-file devEnv.json
      - run: flutter build ipa --dart-define-from-file devEnv.json
      - run: mv build/app/outputs/apk/release/app-release.apk releaseBuilds/BAV_Dealer_dev.apk
      - run: mv build/app/outputs/bundle/release/app-release.aab releaseBuilds/BAV_Dealer_dev.aab
      - run: mv build/ios/ipa/BAVBAVDEALER.ipa releaseBuilds/BAV_Dealer_dev.ipa
      - run: flutter clean
      - run: flutter build apk --dart-define-from-file prodEnv.json
      - run: flutter build appbundle --dart-define-from-file prodEnv.json
      - run: flutter build ipa --dart-define-from-file prodEnv.json
      - run: mv build/app/outputs/apk/release/app-release.apk releaseBuilds/BAV_Dealer_Prod.apk
      - run: mv build/app/outputs/bundle/release/app-release.aab releaseBuilds/BAV_Dealer_Prod.aab
      - run: mv build/ios/ipa/BAVDEALER.ipa releaseBuilds/BAV_Dealer_Prod.ipa
      - name: Push Test Build
        uses: ncipollo/release-action@v1
        with:
          artifacts: "releaseBuilds/*"
          tag: v1.0.${{ github.run_number }}
